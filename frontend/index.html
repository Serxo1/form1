<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 3D Race Replay</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Container principal do Three.js -->
    <div id="canvas-container"></div>

    <!-- Sidebar de widgets -->
    <div id="widget-sidebar">
        <button class="sidebar-toggle" title="Menu de Widgets">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
        <div class="sidebar-icons">
            <!-- Botões são adicionados dinamicamente pelo WidgetManager -->
        </div>
    </div>

    <!-- Container para widgets arrastáveis -->
    <div id="widgets-container"></div>

    <!-- HUD - Controles fixos -->
    <div id="hud">
        <!-- Controles de replay (fixos, não são widgets) -->
        <div id="replay-controls" class="hud-panel">
            <div class="timeline-container">
                <input type="range" id="timeline" min="0" max="100" value="0" step="0.1">
                <div class="time-display">
                    <span id="current-time">00:00:00</span>
                    <span id="total-time">/ 01:30:00</span>
                </div>
            </div>
            <div class="control-buttons">
                <button id="btn-rewind" class="control-btn" title="Voltar 10s">
                    <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
                </button>
                <button id="btn-play" class="control-btn play-btn" title="Play/Pause">
                    <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="icon-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button id="btn-forward" class="control-btn" title="Avançar 10s">
                    <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
                </button>
                <div class="speed-control">
                    <label>Velocidade:</label>
                    <select id="playback-speed">
                        <option value="0.25">0.25x</option>
                        <option value="0.5">0.5x</option>
                        <option value="1" selected>1x</option>
                        <option value="2">2x</option>
                        <option value="4">4x</option>
                        <option value="8">8x</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Controles de câmera - Compactos (fixos, não são widgets) -->
        <div id="camera-controls" class="hud-panel compact">
            <div class="camera-buttons-compact">
                <button class="camera-btn-icon active" data-camera="chase" title="Perseguição (1)">
                    <svg viewBox="0 0 24 24"><path d="M12 4L4 8l8 4 8-4-8-4zM4 12l8 4 8-4M4 16l8 4 8-4"/></svg>
                </button>
                <button class="camera-btn-icon" data-camera="cockpit" title="Cockpit (2)">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
                </button>
                <button class="camera-btn-icon" data-camera="helicopter" title="Helicóptero (3)">
                    <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
                </button>
                <button class="camera-btn-icon" data-camera="free" title="Livre (4)">
                    <svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0013 3.06V1h-2v2.06A8.994 8.994 0 003.06 11H1v2h2.06A8.994 8.994 0 0011 20.94V23h2v-2.06A8.994 8.994 0 0020.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Loading screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <h2>Carregando Corrida</h2>
            <p id="loading-status">Inicializando...</p>
            <div class="loading-bar">
                <div id="loading-progress" class="loading-fill"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
